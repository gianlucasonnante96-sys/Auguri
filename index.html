<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Per te</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 30%, #2b1a3d, #120a1c 70%);
    font-family: 'Georgia', serif; overflow:hidden;
  }
  .scene { perspective: 1200px; }
  .card {
    position:relative; width: 300px; height: 420px;
    transform-style: preserve-3d;
    transition: transform 1.2s cubic-bezier(.2,.8,.3,1);
    cursor:pointer;
  }
  .card.open { transform: rotateY(180deg); }
  .face {
    position:absolute; inset:0; border-radius:16px; backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow: 0 30px 60px rgba(0,0,0,.5);
    padding: 24px; text-align:center;
  }
  .front {
    background: linear-gradient(145deg, #b8860b, #f0d78c 40%, #b8860b);
    color:#3b2a00;
  }
  .front h1 { font-size:22px; letter-spacing:2px; text-transform:uppercase; }
  .front p { margin-top:12px; font-size:14px; }
  .front .seal { margin-top:20px; font-size:40px; }
  .back {
    background: #fffaf0; color:#4a3520; transform: rotateY(180deg);
    justify-content:flex-start; overflow:hidden;
  }
  .back img { width:100%; height:180px; object-fit:cover; border-radius:10px; }
  .back h2 { font-size:18px; margin:14px 0 8px; }
  .back p { font-size:14px; line-height:1.5; }
  .hint {
    position:absolute; bottom:24px; color:#f0d78c; font-size:13px;
    letter-spacing:1px; animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
  .hearts { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .heart { position:absolute; bottom:-40px; color:#ff6b9d; font-size:18px; animation: rise linear infinite; }
  @keyframes rise {
    to { transform: translateY(-110vh) rotate(360deg); opacity:0; }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="card" id="card" onclick="this.classList.toggle('open')">
      <div class="face front">
        <h1>Per te</h1>
        <p>Tocca per aprire</p>
        <div class="seal">💌</div>
      </div>
      <div class="face back">
        <img src="foto.jpg" alt="noi">
        <h2>Buon compleanno ❤️</h2>
        <p>Scrivi qui il tuo messaggio speciale. Qualcosa di personale, un ricordo, una promessa.</p>
      </div>
    </div>
  </div>
  <div class="hint">tocca la card</div>
  <div class="hearts" id="hearts"></div>

<script>
  // cuori fluttuanti
  const hearts = document.getElementById('hearts');
  setInterval(() => {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = ['❤','💛','💗','✨'][Math.floor(Math.random()*4)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.animationDuration = (4 + Math.random()*4) + 's';
    h.style.fontSize = (12 + Math.random()*16) + 'px';
    hearts.appendChild(h);
    setTimeout(() => h.remove(), 8000);
  }, 400);
</script>
</body>
</html>
