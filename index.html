<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Per Alice</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    min-height:100vh;
    background: radial-gradient(circle at 50% 30%, #2b1a3d, #120a1c 70%);
    font-family: Georgia, serif;
    overflow:hidden;
    user-select:none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== SCENA BUSTA ===== */
  .envelope-scene {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1400px;
    transition: opacity 0.9s ease;
    z-index: 2;
  }
  .envelope-scene.hide {
    opacity: 0;
    pointer-events: none;
  }

  .envelope {
    position: relative;
    width: 300px;
    height: 200px;
    cursor: pointer;
    transform: rotate(-3deg);
    filter: drop-shadow(0 30px 45px rgba(0,0,0,.55));
  }
  .envelope:not(.open) {
    animation: invite 2.4s ease-in-out infinite;
  }
  @keyframes invite {
    0%, 100% { transform: rotate(-3deg) translateY(0); }
    50%      { transform: rotate(-3deg) translateY(-6px); }
  }
  .envelope.open {
    animation: none;
    transform: rotate(-3deg);
  }

  /* corpo busta (fronte = parte liscia) */
  .env-body {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(160deg, #faf3dc 0%, #ede2c0 45%, #e0d3ac 100%);
    border-radius: 3px;
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,.06),
      inset 0 -3px 8px rgba(0,0,0,.05);
    z-index: 2;
    overflow: hidden;
  }
  /* texture carta */
  .env-body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,.02) 0, rgba(0,0,0,.02) 1px, transparent 1px, transparent 4px),
      repeating-linear-gradient(0deg,  rgba(0,0,0,.015) 0, rgba(0,0,0,.015) 1px, transparent 1px, transparent 5px);
    pointer-events: none;
  }
  .env-stamp {
    position: absolute;
    top: 14px; right: 14px;
    width: 42px; height: 50px;
    background: linear-gradient(135deg, #c0392b, #e74c3c);
    border: 2px dashed rgba(255,255,255,.6);
    border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    transform: rotate(3deg);
    box-shadow: 0 2px 4px rgba(0,0,0,.15);
    z-index: 3;
  }
  .env-address {
    position: absolute;
    bottom: 22px; left: 20px; right: 20px;
    font-family: 'Brush Script MT', cursive, Georgia;
    font-size: 17px;
    color: #7a6a3f;
    text-align: center;
    opacity: .65;
    z-index: 3;
  }

  /* lembo triangolare che si apre */
  .env-flap {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 110px;
    background: linear-gradient(180deg, #ede2c0 0%, #d8ca9e 100%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform 1.1s cubic-bezier(.4,0,.2,1);
    z-index: 4;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.18));
  }
  .env-flap::after {
    content: '';
    position: absolute;
    inset: 0;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    background: linear-gradient(180deg, rgba(255,255,255,.45), transparent 45%);
  }
  .envelope.open .env-flap {
    transform: rotateX(180deg);
    z-index: 1;
  }

  /* sigillo ceralacca */
  .env-seal {
    position: absolute;
    top: 88px; left: 50%;
    transform: translateX(-50%);
    width: 42px; height: 42px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #e74c3c, #a93226 65%, #7b241c);
    box-shadow:
      0 3px 5px rgba(0,0,0,.4),
      inset -2px -2px 4px rgba(0,0,0,.35),
      inset 2px 2px 5px rgba(255,255,255,.2);
    display: flex; align-items: center; justify-content: center;
    color: #ffe9a8;
    font-size: 16px;
    z-index: 5;
    transition: opacity .5s, transform .5s;
  }
  .envelope.open .env-seal {
    opacity: 0;
    transform: translateX(-50%) scale(.4) rotate(45deg);
  }

  /* ===== BIGLIETTINO ===== */
  .letter {
    position: fixed;
    top: 50%; left: 50%;
    width: 280px;
    height: 200px;
    padding: 28px 24px;
    background: linear-gradient(145deg, #fffdf5, #f8f0d8 60%, #f0e6c8);
    border-radius: 6px;
    box-shadow: 0 30px 60px rgba(0,0,0,.6);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    transform: translate(-50%, 20px) rotate(-4deg) scale(.3);
    opacity: 0;
    transition:
      transform 1.2s cubic-bezier(.2,.8,.3,1.2),
      opacity .6s .15s;
    z-index: 20;
    cursor: pointer;
  }
  .letter::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(184,134,11,.25);
    border-radius: 3px;
    pointer-events: none;
  }
  .letter.show {
    transform: translate(-50%, -50%) rotate(-2deg) scale(1);
    opacity: 1;
  }
  .letter.fly {
    transform: translate(-50%, -160vh) rotate(20deg) scale(.85);
    opacity: 0;
    transition:
      transform 1.4s cubic-bezier(.5,0,.8,.5),
      opacity 1s .3s;
    pointer-events: none;
  }
  .letter .greeting {
    font-family: 'Brush Script MT', cursive, Georgia;
    font-size: 30px;
    color: #7a5a15;
    line-height: 1.15;
    margin-bottom: 12px;
  }
  .letter .heart {
    font-size: 28px;
    color: #c0392b;
    animation: beat 1.2s ease-in-out infinite;
  }
  @keyframes beat {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.25); }
  }

  /* ===== FOTO ATTACCATE CON GRAFFETTA ===== */
  .photo-pinned {
    position: fixed;
    width: clamp(75px, 22vw, 100px);
    height: clamp(96px, 28vw, 128px);
    transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(0);
    opacity: 0;
    transition:
      transform .9s cubic-bezier(.2,1.4,.4,1),
      opacity .45s;
    z-index: 5;
    pointer-events: none;
  }
  .photo-pinned.visible {
    transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(1);
    opacity: 1;
    pointer-events: auto;
  }
  .polaroid {
    position: absolute;
    inset: 0;
    background: #fff;
    padding: 5px 5px 20px;
    border-radius: 2px;
    box-shadow:
      0 1px 2px rgba(0,0,0,.1),
      0 8px 20px rgba(0,0,0,.35),
      0 16px 30px rgba(0,0,0,.15);
  }
  .polaroid img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    background: #222;
  }
  /* graffetta SVG */
  .paperclip {
    position: absolute;
    top: -22px; left: 50%;
    transform: translateX(-50%) rotate(4deg);
    width: 20px; height: 46px;
    filter: drop-shadow(1px 2px 2px rgba(0,0,0,.35));
    z-index: 3;
    pointer-events: none;
  }

  /* cuori fluttuanti */
  .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
  .heart-float { position: absolute; bottom: -40px; animation: rise linear infinite; }
  @keyframes rise {
    to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  .tip {
    position: fixed; bottom: 20px; left: 0; right: 0;
    text-align: center; color: #f0d78c;
    font-size: 12px; letter-spacing: 2px;
    opacity: .75; font-family: Georgia, serif;
    transition: opacity .5s;
    z-index: 30;
  }
</style>
</head>
<body>

<!-- SVG gradient per la graffetta (definita una volta sola) -->
<svg style="position:absolute;width:0;height:0" aria-hidden="true">
  <defs>
    <linearGradient id="paperclipGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7d7d7d"/>
      <stop offset="45%"  stop-color="#e8e8e8"/>
      <stop offset="55%"  stop-color="#c9c9c9"/>
      <stop offset="100%" stop-color="#6f6f6f"/>
    </linearGradient>
  </defs>
</svg>

<div class="envelope-scene" id="scene">
  <div class="envelope" id="envelope">
    <div class="env-body">
      <div class="env-stamp">💌</div>
      <div class="env-address">per Alice</div>
    </div>
    <div class="env-flap"></div>
    <div class="env-seal">❤</div>
  </div>
</div>

<div class="letter" id="letter">
  <div class="greeting">Tanti auguri<br>amore!</div>
  <div class="heart">❤</div>
</div>

<div class="hearts" id="hearts"></div>
<div class="tip" id="tip">tocca la busta</div>

<script>
  /* ────────────────────────────────────────────
     ORDINE DELLE FOTO (esattamente come richiesto)
  ──────────────────────────────────────────── */
  const PHOTOS = [
    'photo1.jpg',
    'photo2.jpg',
    'photo3.jpg',
    'photo4.jpg',
    'photo5.jpg',
    'photo6.jpg',
    'photo7.jpg',
    'photo8.jpg',
    'photo9.jpg',
    'photo10.jpg',
    'photo12.jpg',
    'photo11.jpg'
  ];

  /* Posizioni (centro in % viewport) e rotazioni per un effetto
     "mood board appeso al muro" con le graffette */
  const POSITIONS = [
    { x: 16, y: 14, r:  -9 },
    { x: 45, y: 11, r:   5 },
    { x: 78, y: 15, r:  -6 },
    { x: 10, y: 34, r:   7 },
    { x: 38, y: 32, r: -11 },
    { x: 68, y: 34, r:   6 },
    { x: 90, y: 36, r:  -5 },
    { x: 20, y: 55, r:  -7 },
    { x: 50, y: 53, r:   9 },
    { x: 82, y: 56, r:  -8 },
    { x: 32, y: 76, r:   6 },
    { x: 68, y: 78, r:  -5 }
  ];

  const PAPERCLIP_SVG = `
    <svg class="paperclip" viewBox="0 0 24 48" xmlns="http://www.w3.org/2000/svg">
      <path d="M 8 6
               C 8 3.5, 16 3.5, 16 6
               L 16 36
               C 16 41.5, 8 41.5, 8 36
               L 8 12
               C 8 9, 12.5 9, 12.5 12
               L 12.5 33"
            fill="none" stroke="url(#paperclipGrad)"
            stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  `;

  const envelope = document.getElementById('envelope');
  const letter   = document.getElementById('letter');
  const scene    = document.getElementById('scene');
  const tip      = document.getElementById('tip');
  const hearts   = document.getElementById('hearts');
  const audio    = new Audio('canzone.mp3');

  let state = 0; // 0 chiuso | 1 busta aperta con bigliettino | 2 foto

  envelope.addEventListener('click', () => {
    if (state !== 0) return;
    state = 1;
    envelope.classList.add('open');
    audio.play().catch(()=>{});
    startHearts();
    tip.textContent = '';
    setTimeout(() => {
      letter.classList.add('show');
      tip.textContent = 'tocca il bigliettino';
    }, 700);
  });

  letter.addEventListener('click', () => {
    if (state !== 1) return;
    state = 2;
    letter.classList.add('fly');
    scene.classList.add('hide');
    tip.textContent = '';
    setTimeout(spawnPhotos, 700);
  });

  function spawnPhotos() {
    PHOTOS.forEach((src, i) => {
      const pos = POSITIONS[i] || { x: 50, y: 50, r: 0 };
      const el = document.createElement('div');
      el.className = 'photo-pinned';
      el.style.left = pos.x + '%';
      el.style.top  = pos.y + '%';
      el.style.setProperty('--rot', pos.r + 'deg');
      el.style.zIndex = 10 + i;

      el.innerHTML = `
        ${PAPERCLIP_SVG}
        <div class="polaroid">
          <img src="${src}" alt="">
        </div>
      `;
      document.body.appendChild(el);

      setTimeout(() => el.classList.add('visible'), i * 280);
    });
  }

  function startHearts() {
    setInterval(() => {
      const h = document.createElement('div');
      h.className = 'heart-float';
      h.textContent = ['❤','💛','💗','✨','💖','💕'][Math.floor(Math.random()*6)];
      h.style.left = Math.random()*100 + 'vw';
      h.style.fontSize = (14 + Math.random()*18) + 'px';
      h.style.animationDuration = (5 + Math.random()*4) + 's';
      hearts.appendChild(h);
      setTimeout(() => h.remove(), 10000);
    }, 500);
  }
</script>
</body>
</html>
