<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Per Alice</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    min-height:100vh;
    background: radial-gradient(circle at 50% 30%, #2b1a3d, #120a1c 70%);
    font-family: Georgia, serif;
    overflow:hidden;
    user-select:none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== BUSTA ===== */
  .envelope-scene {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    perspective: 1400px;
    transition: opacity 0.9s ease;
    z-index: 2;
  }
  .envelope-scene.hide { opacity: 0; pointer-events: none; }

  .envelope {
    position: relative;
    width: 300px; height: 200px;
    cursor: pointer;
    transform: rotate(-3deg);
    filter: drop-shadow(0 30px 45px rgba(0,0,0,.55));
  }
  .envelope:not(.open) { animation: invite 2.4s ease-in-out infinite; }
  @keyframes invite {
    0%, 100% { transform: rotate(-3deg) translateY(0); }
    50%      { transform: rotate(-3deg) translateY(-6px); }
  }
  .envelope.open { animation: none; transform: rotate(-3deg); }

  .env-body {
    position: absolute; inset: 0;
    background: linear-gradient(160deg, #faf3dc 0%, #ede2c0 45%, #e0d3ac 100%);
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06), inset 0 -3px 8px rgba(0,0,0,.05);
    z-index: 2; overflow: hidden;
  }
  .env-body::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,.02) 0, rgba(0,0,0,.02) 1px, transparent 1px, transparent 4px),
      repeating-linear-gradient(0deg,  rgba(0,0,0,.015) 0, rgba(0,0,0,.015) 1px, transparent 1px, transparent 5px);
    pointer-events: none;
  }
  .env-stamp {
    position: absolute; top: 14px; right: 14px;
    width: 42px; height: 50px;
    background: linear-gradient(135deg, #c0392b, #e74c3c);
    border: 2px dashed rgba(255,255,255,.6);
    border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; transform: rotate(3deg);
    box-shadow: 0 2px 4px rgba(0,0,0,.15);
    z-index: 3;
  }
  .env-address {
    position: absolute; bottom: 22px; left: 20px; right: 20px;
    font-family: 'Brush Script MT', cursive, Georgia;
    font-size: 17px; color: #7a6a3f; text-align: center;
    opacity: .65; z-index: 3;
  }
  .env-flap {
    position: absolute; top: 0; left: 0; right: 0;
    height: 110px;
    background: linear-gradient(180deg, #ede2c0 0%, #d8ca9e 100%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform 1.1s cubic-bezier(.4,0,.2,1);
    z-index: 4;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.18));
  }
  .env-flap::after {
    content: ''; position: absolute; inset: 0;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    background: linear-gradient(180deg, rgba(255,255,255,.45), transparent 45%);
  }
  .envelope.open .env-flap { transform: rotateX(180deg); z-index: 1; }

  /* ===== SIGILLO (PULSANTE PLAY) ===== */
  .env-seal {
    position: absolute; top: 88px; left: 50%;
    transform: translateX(-50%);
    width: 48px; height: 48px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #e74c3c, #a93226 65%, #7b241c);
    box-shadow: 0 3px 5px rgba(0,0,0,.4), inset -2px -2px 4px rgba(0,0,0,.35), inset 2px 2px 5px rgba(255,255,255,.2);
    display: flex; align-items: center; justify-content: center;
    color: #ffe9a8; font-size: 20px;
    z-index: 5;
    transition: opacity .5s, transform .5s;
    cursor: pointer;
    /* Animazione di "invito" al click */
    animation: pulseSeal 1.8s ease-in-out infinite;
  }
  @keyframes pulseSeal {
    0%, 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.6), inset -2px -2px 4px rgba(0,0,0,.35); }
    50%      { box-shadow: 0 0 0 15px rgba(231, 76, 60, 0), inset -2px -2px 4px rgba(0,0,0,.35); }
  }
  .envelope.open .env-seal { 
    opacity: 0; 
    transform: translateX(-50%) scale(.4) rotate(45deg); 
    animation: none;
  }

  /* Scritta di aiuto sotto la busta */
  .tap-hint {
    position: absolute;
    bottom: -50px; left: 50%;
    transform: translateX(-50%);
    color: #f0d78c;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: Georgia, serif;
    white-space: nowrap;
    pointer-events: none;
    animation: pulseHint 2s infinite;
    transition: opacity .5s;
  }
  @keyframes pulseHint {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 1; }
  }
  .envelope.open .tap-hint { opacity: 0; }

  /* ===== BIGLIETTINO ===== */
  .letter {
    position: fixed; top: 50%; left: 50%;
    width: 280px; height: 200px;
    padding: 28px 24px;
    background: linear-gradient(145deg, #fffdf5, #f8f0d8 60%, #f0e6c8);
    border-radius: 6px;
    box-shadow: 0 30px 60px rgba(0,0,0,.6);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    transform: translate(-50%, 20px) rotate(-4deg) scale(.3);
    opacity: 0;
    transition: transform 1.2s cubic-bezier(.2,.8,.3,1.2), opacity .6s .15s;
    z-index: 20; cursor: pointer;
  }
  .letter::before {
    content: ''; position: absolute; inset: 6px;
    border: 1px solid rgba(184,134,11,.25);
    border-radius: 3px; pointer-events: none;
  }
  .letter.show { transform: translate(-50%, -50%) rotate(-2deg) scale(1); opacity: 1; }
  .letter.fly {
    transform: translate(-50%, -160vh) rotate(20deg) scale(.85);
    opacity: 0;
    transition: transform 1.4s cubic-bezier(.5,0,.8,.5), opacity 1s .3s;
    pointer-events: none;
  }
  .letter .greeting {
    font-family: 'Brush Script MT', cursive, Georgia;
    font-size: 30px; color: #7a5a15; line-height: 1.15; margin-bottom: 12px;
  }
  .letter .heart {
    font-size: 28px; color: #c0392b;
    animation: beat 1.2s ease-in-out infinite;
  }
  @keyframes beat {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.25); }
  }

  /* ===== FOTO CON PUNTINE ===== */
  .photo-pinned {
    position: fixed;
    width: clamp(75px, 22vw, 100px);
    height: clamp(96px, 28vw, 128px);
    transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(0);
    opacity: 0;
    transition: transform .9s cubic-bezier(.2,1.4,.4,1), opacity .45s;
    z-index: 5;
    pointer-events: none;
  }
  .photo-pinned.visible {
    transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(1);
    opacity: 1;
    pointer-events: auto;
    cursor: zoom-in;
  }
  .polaroid {
    position: absolute; inset: 0;
    background: #fff;
    padding: 5px 5px 20px;
    border-radius: 2px;
    box-shadow: 0 1px 2px rgba(0,0,0,.1), 0 8px 20px rgba(0,0,0,.35), 0 16px 30px rgba(0,0,0,.15);
  }
  .polaroid img {
    width: 100%; height: 100%;
    object-fit: cover; display: block; background: #222;
  }
  .pin {
    position: absolute; top: -26px; left: 50%;
    transform: translateX(-50%);
    width: 22px; height: 40px;
    filter: drop-shadow(1px 2px 3px rgba(0,0,0,.45));
    z-index: 3; pointer-events: none;
  }

  /* ===== LIGHTBOX ===== */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(5, 3, 10, 0.9);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; opacity: 0; transition: opacity .35s;
    cursor: zoom-out;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .lightbox.visible { opacity: 1; }
  .lb-frame {
    background: #fff; padding: 12px 12px 34px; border-radius: 4px;
    box-shadow: 0 40px 100px rgba(0,0,0,.8);
    transform: scale(.7) rotate(-2deg);
    transition: transform .45s cubic-bezier(.2,.8,.3,1.2);
    max-width: 92vw; max-height: 90vh; position: relative;
  }
  .lightbox.visible .lb-frame { transform: scale(1) rotate(0deg); }
  .lb-frame img { display: block; max-width: 82vw; max-height: 72vh; object-fit: contain; background: #111; }
  .lb-frame::after {
    content: 'tocca per chiudere'; position: absolute; bottom: 10px; left: 0; right: 0;
    text-align: center; font-family: Georgia, serif; font-size: 11px; letter-spacing: 2px; color: #999;
  }

  /* ===== TITOLO FINALE ===== */
  .birthday-title {
    position: fixed; bottom: 3vh; left: 50%;
    transform: translateX(-50%) translateY(30px) scale(0.9);
    padding: 10px 28px;
    background: rgba(20, 10, 28, 0.72);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(247,220,111,.3);
    border-radius: 50px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5), 0 0 40px rgba(247,220,111,.15);
    text-align: center; font-family: 'Brush Script MT', cursive, Georgia;
    font-size: 22px; color: #f7dc6f;
    text-shadow: 0 0 20px rgba(247,220,111,.5);
    white-space: nowrap; letter-spacing: 1px;
    opacity: 0;
    transition: opacity 1.2s ease .2s, transform 1.2s cubic-bezier(.2,.8,.3,1.2);
    z-index: 25; pointer-events: none;
  }
  .birthday-title.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  .birthday-title .heart-inline { color: #e74c3c; margin-left: 4px; display: inline-block; animation: beat 1.2s ease-in-out infinite; }

  /* cuori fluttuanti */
  .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
  .heart-float { position: absolute; bottom: -40px; animation: rise linear infinite; }
  @keyframes rise { to { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }

  .tip {
    position: fixed; bottom: 20px; left: 0; right: 0;
    text-align: center; color: #f0d78c;
    font-size: 12px; letter-spacing: 2px;
    opacity: .75; font-family: Georgia, serif;
    transition: opacity .5s; z-index: 30;
  }
</style>
</head>
<body>

<!-- Player YouTube NASCOSTO (1px per 1px) -->
<div id="youtube-player" style="position: fixed; top: -10px; left: -10px; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; z-index: -1;"></div>

<div class="envelope-scene" id="scene">
  <div class="envelope" id="envelope">
    <div class="env-body">
      <div class="env-stamp">💌</div>
      <div class="env-address">per Alice</div>
    </div>
    <div class="env-flap"></div>
    <!-- Il sigillo a forma di cuore che funge da Pulsante Play -->
    <div class="env-seal" id="seal">❤</div>
    <!-- Scritta che invita a cliccare -->
    <div class="tap-hint" id="tapHint">Tocca il cuore per aprire</div>
  </div>
</div>

<div class="letter" id="letter">
  <div class="greeting">Tanti auguri<br>amore!</div>
  <div class="heart">❤</div>
</div>

<div class="birthday-title" id="title">
  Buon compleanno, Alice <span class="heart-inline">❤</span>
</div>

<div class="hearts" id="hearts"></div>
<div class="tip" id="tip"></div>

<script>
  /* ────────────────────────────────────────────
     CONFIGURAZIONE
  ──────────────────────────────────────────── */
  const YOUTUBE_ID = 'jYcaxxbiwUo';

  const PHOTOS = [
    'photo1.jpg','photo2.jpg','photo3.jpg','photo4.jpg',
    'photo5.jpg','photo6.jpg','photo7.jpg','photo8.jpg',
    'photo9.jpg','photo10.jpg','photo12.jpg','photo11.jpg'
  ];

  const POSITIONS = [
    { x: 16, y: 14, r:  -9 }, { x: 45, y: 11, r:   5 }, { x: 78, y: 15, r:  -6 },
    { x: 10, y: 34, r:   7 }, { x: 38, y: 32, r: -11 }, { x: 68, y: 34, r:   6 }, { x: 90, y: 36, r:  -5 },
    { x: 20, y: 55, r:  -7 }, { x: 50, y: 53, r:   9 }, { x: 82, y: 56, r:  -8 },
    { x: 32, y: 76, r:   6 }, { x: 68, y: 78, r:  -5 }
  ];

  const PIN_TYPES  = ['circle', 'heart', 'star', 'flower'];
  const PIN_COLORS = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#9b59b6', '#e67e22'];

  /* ────────────────────────────────────────────
     GENERATORE PUNTINE
  ──────────────────────────────────────────── */
  function pinSVG(type, color) {
    const needle = `
      <line x1="15" y1="22" x2="15" y2="40" stroke="#7a7a7a" stroke-width="1.7" stroke-linecap="round"/>
      <line x1="15" y1="22" x2="15" y2="40" stroke="#d0d0d0" stroke-width="0.6" stroke-linecap="round"/>
    `;
    let head = '';
    switch (type) {
      case 'heart':
        head = `<path d="M15 6 C 11 2, 4 4, 4 10 C 4 15, 15 23, 15 23 C 15 23, 26 15, 26 10 C 26 4, 19 2, 15 6 Z" fill="${color}" stroke="rgba(0,0,0,.2)" stroke-width="0.8"/>
                <ellipse cx="10" cy="8" rx="2" ry="1.3" fill="rgba(255,255,255,.45)" transform="rotate(-25 10 8)"/>`;
        break;
      case 'star':
        head = `<path d="M15 3 L 18 10 L 26 11 L 20 16 L 22 24 L 15 20 L 8 24 L 10 16 L 4 11 L 12 10 Z" fill="${color}" stroke="rgba(0,0,0,.2)" stroke-width="0.8"/>
                <circle cx="12" cy="8" r="1.2" fill="rgba(255,255,255,.5)"/>`;
        break;
      case 'flower':
        head = `<g fill="${color}" stroke="rgba(0,0,0,.2)" stroke-width="0.6">
          <circle cx="15" cy="7" r="4.5"/><circle cx="15" cy="19" r="4.5"/><circle cx="7" cy="13" r="4.5"/><circle cx="23" cy="13" r="4.5"/>
          <circle cx="15" cy="13" r="4.5" fill="#f7dc6f"/></g>
        <circle cx="13.5" cy="11" r="1.2" fill="rgba(255,255,255,.55)"/>`;
        break;
      default: /* circle */
        head = `<circle cx="15" cy="13" r="9.5" fill="${color}" stroke="rgba(0,0,0,.2)" stroke-width="0.8"/>
                <circle cx="11" cy="9.5" r="2.8" fill="rgba(255,255,255,.45)"/>`;
    }
    return `<svg class="pin" viewBox="0 0 30 44" xmlns="http://www.w3.org/2000/svg">${needle}${head}</svg>`;
  }

  /* ────────────────────────────────────────────
     STATO E RIFERIMENTI DOM
  ──────────────────────────────────────────── */
  const envelope = document.getElementById('envelope');
  const letter   = document.getElementById('letter');
  const scene    = document.getElementById('scene');
  const tip      = document.getElementById('tip');
  const hearts   = document.getElementById('hearts');
  const title    = document.getElementById('title');

  let state = 0;
  let player = null;

  /* ────────────────────────────────────────────
     YOUTUBE API (Nascosta)
  ──────────────────────────────────────────── */
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('youtube-player', {
      height: '1',
      width: '1',
      videoId: YOUTUBE_ID,
      playerVars: {
        'autoplay': 0,
        'controls': 0,
        'loop': 1,
        'playlist': YOUTUBE_ID,
        'playsinline': 1,
        'origin': window.location.origin
      }
    });
  }

  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  const firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  /* ────────────────────────────────────────────
     CLICK SUL CUORE (O SULLA BUSTA)
  ──────────────────────────────────────────── */
  function openEnvelope() {
    if (state !== 0) return;
    state = 1;
    envelope.classList.add('open');
    
    // Tenta di far partire la musica invisibile (ora funziona su iOS)
    if (player && player.playVideo) {
      player.playVideo();
    } else {
      setTimeout(() => {
        if (player && player.playVideo) player.playVideo();
      }, 1000);
    }

    startHearts();
    tip.textContent = '';
    
    setTimeout(() => {
      letter.classList.add('show');
      tip.textContent = 'tocca il bigliettino';
    }, 700);
  }

  // Rende cliccabile sia il cuore che tutta la busta (per comodità)
  document.getElementById('seal').addEventListener('click', (e) => {
    e.stopPropagation();
    openEnvelope();
  });
  envelope.addEventListener('click', (e) => {
    if (e.target.id === 'seal') return; // evita doppio trigger
    openEnvelope();
  });

  /* ────────────────────────────────────────────
     CLICK BIGLIETTINO
  ──────────────────────────────────────────── */
  letter.addEventListener('click', () => {
    if (state !== 1) return;
    state = 2;
    letter.classList.add('fly');
    scene.classList.add('hide');
    tip.textContent = '';
    
    setTimeout(spawnPhotos, 700);
    setTimeout(() => title.classList.add('show'), 700 + PHOTOS.length * 280 + 900);
  });

  /* ────────────────────────────────────────────
     CREAZIONE FOTO
  ──────────────────────────────────────────── */
  function spawnPhotos() {
    PHOTOS.forEach((src, i) => {
      const pos = POSITIONS[i] || { x: 50, y: 50, r: 0 };
      const type  = PIN_TYPES[i % PIN_TYPES.length];
      const color = PIN_COLORS[i % PIN_COLORS.length];

      const el = document.createElement('div');
      el.className = 'photo-pinned';
      el.style.left = pos.x + '%';
      el.style.top  = pos.y + '%';
      el.style.setProperty('--rot', pos.r + 'deg');
      el.style.zIndex = 10 + i;

      el.innerHTML = `
        ${pinSVG(type, color)}
        <div class="polaroid"><img src="${src}" alt=""></div>
      `;
      document.body.appendChild(el);

      el.addEventListener('click', (e) => {
        e.stopPropagation();
        openLightbox(src);
      });

      setTimeout(() => el.classList.add('visible'), i * 280);
    });
  }

  /* ────────────────────────────────────────────
     LIGHTBOX
  ──────────────────────────────────────────── */
  function openLightbox(src) {
    const lb = document.createElement('div');
    lb.className = 'lightbox';
    lb.innerHTML = `<div class="lb-frame"><img src="${src}" alt=""></div>`;
    document.body.appendChild(lb);
    
    requestAnimationFrame(() => lb.classList.add('visible'));
    
    lb.addEventListener('click', (e) => {
      e.stopPropagation();
      lb.classList.remove('visible');
      setTimeout(() => lb.remove(), 400);
    });
  }

  /* ────────────────────────────────────────────
     CUORI
  ──────────────────────────────────────────── */
  function startHearts() {
    setInterval(() => {
      const h = document.createElement('div');
      h.className = 'heart-float';
      h.textContent = ['❤','💛','💗','✨','💖','💕'][Math.floor(Math.random()*6)];
      h.style.left = Math.random()*100 + 'vw';
      h.style.fontSize = (14 + Math.random()*18) + 'px';
      h.style.animationDuration = (5 + Math.random()*4) + 's';
      hearts.appendChild(h);
      setTimeout(() => h.remove(), 10000);
    }, 500);
  }
</script>
</body>
</html>
