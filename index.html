<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Per Alice</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 30%, #2b1a3d, #120a1c 70%);
    font-family: Georgia, serif; overflow:hidden;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }

  .stage {
    position: relative; width: 320px; height: 500px;
    perspective: 1400px;
  }

  /* ===== PACCO ===== */
  .box {
    position: absolute; bottom: 40px; left: 50%;
    margin-left: -100px; width: 200px; height: 190px;
    transform-style: preserve-3d;
  }
  .box-body {
    position: absolute; inset: 70px 0 0 0;
    background: linear-gradient(145deg, #c0392b, #e74c3c 40%, #a93226);
    border-radius: 6px;
    box-shadow: inset -20px -20px 40px rgba(0,0,0,.35), 0 20px 40px rgba(0,0,0,.5);
    z-index: 2;
  }
  .box-body::before {
    content:''; position:absolute; left:50%; top:0; bottom:0;
    width: 26px; margin-left:-13px;
    background: linear-gradient(to right, #b8860b, #f7dc6f 50%, #b8860b);
  }
  .box-body::after {
    content:''; position:absolute; top:50%; left:0; right:0;
    height: 26px; margin-top:-13px;
    background: linear-gradient(to bottom, #b8860b, #f7dc6f 50%, #b8860b);
  }
  .box-lid {
    position: absolute; top: 0; left: -10px; right: -10px;
    height: 70px;
    background: linear-gradient(145deg, #e74c3c, #f5b7b1 40%, #c0392b);
    border-radius: 6px;
    transform-origin: center bottom;
    transition: transform 1s cubic-bezier(.5,-0.2,.3,1.3), opacity .8s;
    box-shadow: inset 0 -10px 20px rgba(0,0,0,.3), 0 10px 25px rgba(0,0,0,.4);
    z-index: 3;
  }
  .box-lid::before {
    content:''; position:absolute; left:50%; top:0; bottom:0;
    width: 26px; margin-left:-13px;
    background: linear-gradient(to right, #b8860b, #f7dc6f 50%, #b8860b);
  }
  .box-lid::after {
    content:'🎀'; position:absolute; left:50%; top:-48px;
    transform: translateX(-50%); font-size: 56px;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.4));
  }

  .box.ready:not(.open) { animation: wiggle 1.6s ease-in-out infinite; cursor: pointer; }
  @keyframes wiggle {
    0%,100% { transform: rotate(0); }
    25% { transform: rotate(-1.5deg); }
    75% { transform: rotate(1.5deg); }
  }
  .box.open .box-lid {
    transform: translateY(-250px) rotate(-30deg);
    opacity: 0;
  }

  /* ===== FOTO POLAROID CHE VOLANO FUORI ===== */
  .photo-card {
    position: absolute; left: 50%; top: 50%;
    width: 118px; height: 155px;
    margin: -77px 0 0 -59px;
    background: #fff;
    padding: 6px 6px 26px;
    border-radius: 3px;
    box-shadow: 0 15px 30px rgba(0,0,0,.5);
    /* start: sepolta nel pacco */
    transform: translate(0, 40px) scale(0.1) rotate(0deg);
    opacity: 0;
    transition:
      transform 1.3s cubic-bezier(.2,.8,.3,1.35) var(--delay),
      opacity .5s var(--delay);
    z-index: calc(5 + var(--i));
    pointer-events: none;
    will-change: transform;
  }
  .photo-card .inner {
    width: 100%; height: 100%;
    overflow: hidden; background: #111;
  }
  .photo-card img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .photo-card.visible {
    transform: translate(var(--x), var(--y)) scale(1) rotate(var(--rot));
    opacity: 1;
  }
  /* fluttuamento morbido (solo sull'immagine interna, per non toccare il transform principale) */
  .photo-card.visible .inner {
    animation: img-float 4.5s ease-in-out infinite;
    animation-delay: var(--float-delay, 0s);
  }
  @keyframes img-float {
    0%,100% { transform: translateY(0) scale(1); }
    50%     { transform: translateY(-4px) scale(1.01); }
  }

  /* ===== BIGLIETTINO ===== */
  .card {
    position: absolute; top: 100px; left: 50%; margin-left: -90px;
    width: 180px; height: 120px;
    transform-style: preserve-3d;
    transform: rotate(-6deg);
    transition: transform 1.1s cubic-bezier(.3,.2,.2,1), opacity .6s;
    cursor: pointer; z-index: 30;
  }
  .card.flipped {
    transform: translateY(-20px) rotate(-6deg) rotateY(180deg);
  }
  .card.fly {
    transform: translateY(-700px) translateX(80px) rotate(25deg) rotateY(360deg) scale(0.4);
    opacity: 0;
    transition: transform 1.6s cubic-bezier(.3,.1,.7,1), opacity 1.2s;
    pointer-events: none;
  }
  .card-face {
    position: absolute; inset: 0; border-radius: 8px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 12px; text-align: center;
    box-shadow: 0 15px 30px rgba(0,0,0,.45);
    font-family: Georgia, serif;
  }
  .card-front {
    background: linear-gradient(145deg, #fffaf0, #f5e6c8);
    color: #8b6b2f;
  }
  .card-front .label {
    font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 2px; opacity: .7;
  }
  .card-front .name {
    font-family: 'Brush Script MT', cursive, Georgia;
    font-size: 32px; color: #b8860b; line-height: 1;
  }
  .card-front .hint {
    position: absolute; bottom: 8px; left: 0; right: 0;
    font-size: 9px; opacity: .5; letter-spacing: 1px;
  }
  .card-back {
    background: linear-gradient(145deg, #ffe9a8, #f7dc6f);
    color: #7d5a1a;
    transform: rotateY(180deg);
    font-family: 'Brush Script MT', cursive, Georgia;
  }
  .card-back .big { font-size: 24px; line-height: 1.15; }
  .card-back .heart {
    font-size: 32px; margin-top: 4px;
    animation: beat 1.1s ease-in-out infinite;
  }
  @keyframes beat {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  /* cuori fluttuanti */
  .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
  .heart-float { position: absolute; bottom: -40px; animation: rise linear infinite; }
  @keyframes rise {
    to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  .tip {
    position: fixed; bottom: 20px; left: 0; right: 0;
    text-align: center; color: #f0d78c;
    font-size: 12px; letter-spacing: 2px;
    opacity: .7; font-family: Georgia, serif;
    transition: opacity .5s; z-index: 20;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="box" id="box">
    <div class="box-body"></div>
    <div class="box-lid"></div>
  </div>

  <div class="card" id="card">
    <div class="card-face card-front">
      <div class="label">per</div>
      <div class="name">Alice</div>
      <div class="hint">tocca per aprire</div>
    </div>
    <div class="card-face card-back">
      <div class="big">Tanti auguri<br>amore!</div>
      <div class="heart">❤</div>
    </div>
  </div>
</div>

<div class="hearts" id="hearts"></div>
<div class="tip" id="tip">tocca il bigliettino</div>

<script>
  /* ────────────────────────────────────────────
     QUI METTI I NOMI DELLE TUE FOTO
     (nella stessa cartella di index.html)
     Es: 'foto1.jpg', 'foto2.jpg', 'foto3.jpg' ...
     Consigliato: 3-6 foto
  ──────────────────────────────────────────── */
  const PHOTOS = [
    'photo1.jpg',
    'photo2.jpg',
    'photo3.jpg',
    'photo4.jpg',
    'photo5.jpg',
    'photo6.jpg',
    'photo7.jpg',
    'photo8.jpg',
    'photo9.jpg',
    'photo10.jpg',
    'photo12.jpg',
    'photo11.jpg'
  ];
  /* ──────────────────────────────────────────── */

  const card   = document.getElementById('card');
  const box    = document.getElementById('box');
  const tip    = document.getElementById('tip');
  const hearts = document.getElementById('hearts');
  const stage  = document.querySelector('.stage');
  const audio  = new Audio('canzone.mp3');

  let step = 0;

  // PASSO 1 e 2: bigliettino
  card.addEventListener('click', (e) => {
    e.stopPropagation();
    if (step === 0) {
      card.classList.add('flipped');
      tip.textContent = 'tocca ancora per chiudere';
      step = 1;
    } else if (step === 1) {
      card.classList.add('fly');
      box.classList.add('ready');
      tip.textContent = 'ora tocca il pacco 🎁';
      step = 2;
    }
  });

  // PASSO 3: pacco → foto escono + musica
  box.addEventListener('click', (e) => {
    e.stopPropagation();
    if (step === 2) {
      box.classList.remove('ready');
      box.classList.add('open');
      tip.textContent = '';
      audio.play().catch(()=>{});
      startHearts();
      spawnPhotos();
      step = 3;
    }
  });

  // ── CREAZIONE FOTO A VENTAGLIO ──
  function spawnPhotos() {
    const n = PHOTOS.length;
    // angolo totale del ventaglio (gradi)
    const spread = n <= 2 ? 30 : n === 3 ? 55 : n === 4 ? 75 : n === 5 ? 90 : 105;
    const radius = 155;

    PHOTOS.forEach((src, i) => {
      const el = document.createElement('div');
      el.className = 'photo-card';
      el.style.setProperty('--i', i);

      // angolo da -spread/2 a +spread/2
      const angle = n === 1 ? 0 : -spread/2 + (spread * i / (n - 1));
      const rad = angle * Math.PI / 180;
      const x = Math.sin(rad) * radius;
      const y = -Math.cos(rad) * radius;

      el.style.setProperty('--x', x + 'px');
      el.style.setProperty('--y', y + 'px');
      el.style.setProperty('--rot', angle + 'deg');
      el.style.setProperty('--delay', (0.15 + i * 0.35) + 's');
      el.style.setProperty('--float-delay', (i * 0.4) + 's');

      el.innerHTML = `<div class="inner"><img src="${src}" alt=""></div>`;
      stage.appendChild(el);

      // trigger transizione
      requestAnimationFrame(() => {
        setTimeout(() => el.classList.add('visible'),
                   300 + i * 350); // piccola attesa per far partire il lid
      });
    });
  }

  function startHearts() {
    setInterval(() => {
      const h = document.createElement('div');
      h.className = 'heart-float';
      h.textContent = ['❤','💛','💗','✨','💖','💕'][Math.floor(Math.random()*6)];
      h.style.left = Math.random()*100 + 'vw';
      h.style.fontSize = (14 + Math.random()*18) + 'px';
      h.style.animationDuration = (4 + Math.random()*4) + 's';
      hearts.appendChild(h);
      setTimeout(() => h.remove(), 9000);
    }, 350);
  }
</script>
</body>
</html>
